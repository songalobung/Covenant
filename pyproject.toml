[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovdistress"
version = "0.1.0"
description = "Sovereign Distress & Restructuring Estimator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "lifelines",
    "pydantic>=2.0",
    "typer>=0.9.0",
    "matplotlib",
    "pyyaml",
    "openpyxl>=3.0.0",
    "xlsxwriter>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

license = {text = "Apache-2.0"}

[project.scripts]
covenant = "sovdistress.cli:app"
sovdistress = "sovdistress.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
